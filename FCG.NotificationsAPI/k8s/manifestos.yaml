apiVersion: v1
kind: ConfigMap
metadata:
  name: notifications-config
  namespace: default
data:
  RABBITMQ_HOST: "rabbitmq-service"
  ASPNETCORE_ENVIRONMENT: "Production"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifications-deployment
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notifications-api
  template:
    metadata:
      labels:
        app: notifications-api
    spec:
      containers:
      - name: notifications-api
        image: fcg-notifications-api:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: notifications-config
---
apiVersion: v1
kind: Service
metadata:
  name: notifications-service
  namespace: default
spec:
  selector:
    app: notifications-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP